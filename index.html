<head>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --fg: #ffffff;
            --muted: #888888;
            --accent-blue: #00d4ff;
            --accent-purple: #a855f7;
            --accent-pink: #ec4899;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--fg);
            min-height: 100vh;
            overflow-x: hidden;
        }

        h1, h2, h3 {
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Animated Background */
        .bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }

        /* Gradient Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: float 20s ease-in-out infinite;
            pointer-events: none;
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, var(--accent-blue) 0%, transparent 70%);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .orb-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-purple) 0%, transparent 70%);
            bottom: -150px;
            left: -100px;
            animation-delay: -7s;
        }

        .orb-3 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, var(--accent-pink) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(20px, 30px) scale(1.02); }
        }

        /* Glass Card */
        .glass {
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 24px;
        }

        .glass-strong {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(30px);
            -webkit-backdrop-filter: blur(30px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Profile Image Container */
        .profile-container {
            position: relative;
            width: 200px;
            height: 200px;
        }

        @media (min-width: 768px) {
            .profile-container {
                width: 240px;
                height: 240px;
            }
        }

        .profile-glow {
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            animation: rotate-glow 4s linear infinite;
            opacity: 0.8;
        }

        @keyframes rotate-glow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .profile-ring {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            padding: 3px;
            animation: pulse-ring 3s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.02); opacity: 0.8; }
        }

        .profile-inner {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--bg);
            padding: 4px;
            position: relative;
            overflow: hidden;
        }

        .profile-image {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.8s ease, transform 0.8s ease;
            position: absolute;
            top: 0;
            left: 0;
        }

        .profile-image.active {
            opacity: 1;
            transform: scale(1.02);
        }

        /* Typing Animation */
        .typing-container {
            min-height: 32px;
        }

        .typing-text {
            display: inline-block;
            border-right: 2px solid var(--accent-blue);
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            50% { border-color: transparent; }
        }

        /* Name Glow */
        .name-glow {
            background: linear-gradient(135deg, var(--fg) 0%, var(--accent-blue) 50%, var(--accent-purple) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Social Buttons */
        .social-btn {
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .social-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple), var(--accent-pink));
            opacity: 0;
            transition: opacity 0.4s ease;
            z-index: -1;
        }

        .social-btn:hover::before {
            opacity: 0.15;
        }

        .social-btn:hover {
            transform: translateY(-4px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 40px -15px rgba(0, 212, 255, 0.3);
        }

        .social-btn:active {
            transform: translateY(-2px) scale(1);
        }

        /* Contact Items */
        .contact-item {
            transition: all 0.3s ease;
        }

        .contact-item:hover {
            transform: translateX(8px);
        }

        /* Copy Button */
        .copy-btn {
            position: relative;
            overflow: hidden;
        }

        .copy-btn::after {
            content: 'Copied!';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            color: var(--bg);
            font-weight: 600;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .copy-btn.copied::after {
            opacity: 1;
        }

        /* Share Button */
        .share-btn {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            position: relative;
            overflow: hidden;
        }

        .share-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .share-btn:hover::before {
            opacity: 1;
        }

        .share-btn span {
            position: relative;
            z-index: 1;
        }

        /* Entrance Animations */
        .reveal {
            opacity: 0;
            transform: translateY(40px);
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .reveal.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Hero Animations */
        .hero-fade {
            animation: heroFade 1.2s ease forwards;
        }

        @keyframes heroFade {
            from {
                opacity: 0;
                transform: translateY(30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .hero-fade-delay-1 { animation-delay: 0.2s; opacity: 0; }
        .hero-fade-delay-2 { animation-delay: 0.4s; opacity: 0; }
        .hero-fade-delay-3 { animation-delay: 0.6s; opacity: 0; }
        .hero-fade-delay-4 { animation-delay: 0.8s; opacity: 0; }

        /* Particle */
        .particle {
            position: fixed;
            width: 2px;
            height: 2px;
            background: var(--accent-blue);
            border-radius: 50%;
            pointer-events: none;
            opacity: 0;
        }

        /* Focus States */
        button:focus-visible,
        a:focus-visible {
            outline: 2px solid var(--accent-blue);
            outline-offset: 2px;
        }

        /* Reduced Motion */
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg);
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(var(--accent-blue), var(--accent-purple));
            border-radius: 3px;
        }

        /* Line Animation */
        .gradient-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-blue), var(--accent-purple), var(--accent-pink), transparent);
        }

        /* Dots Indicator */
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--muted);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .dot.active {
            background: var(--accent-blue);
            box-shadow: 0 0 20px var(--accent-blue);
        }
    </style>
</head>

    <script>
        // Initialize variables first
        const typingPhrases = [
            "Welcome to my personal profile",
            "Full Stack Developer",
            "Bot & Automation Expert",
            "Let's build something amazing"
        ];
        
        let currentPhraseIndex = 0;
        let currentCharIndex = 0;
        let isDeleting = false;
        const typingElement = document.getElementById('typingText');
        
        const images = document.querySelectorAll('.profile-image');
        const dots = document.querySelectorAll('.dot');
        let currentImageIndex = 0;

        // Typing Animation
        function typeText() {
            const currentPhrase = typingPhrases[currentPhraseIndex];
            
            if (isDeleting) {
                typingElement.textContent = currentPhrase.substring(0, currentCharIndex - 1);
                currentCharIndex--;
            } else {
                typingElement.textContent = currentPhrase.substring(0, currentCharIndex + 1);
                currentCharIndex++;
            }

            let typeSpeed = isDeleting ? 30 : 80;

            if (!isDeleting && currentCharIndex === currentPhrase.length) {
                typeSpeed = 2000;
                isDeleting = true;
            } else if (isDeleting && currentCharIndex === 0) {
                isDeleting = false;
                currentPhraseIndex = (currentPhraseIndex + 1) % typingPhrases.length;
                typeSpeed = 500;
            }

            setTimeout(typeText, typeSpeed);
        }

        // Image Slider
        function showImage(index) {
            images.forEach((img, i) => {
                img.classList.toggle('active', i === index);
            });
            dots.forEach((dot, i) => {
                dot.classList.toggle('active', i === index);
            });
        }

        function nextImage() {
            currentImageIndex = (currentImageIndex + 1) % images.length;
            showImage(currentImageIndex);
        }

        // Dot click handlers
        dots.forEach((dot, index) => {
            dot.addEventListener('click', () => {
                currentImageIndex = index;
                showImage(index);
            });
        });

        // Copy Link Function
        function copyLink() {
            const url = window.location.href;
            navigator.clipboard.writeText(url).then(() => {
                const btn = document.querySelector('.copy-btn');
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.classList.remove('copied');
                }, 2000);
            });
        }

        // Share Function
        function shareProfile() {
            const shareData = {
                title: 'Nafiz Sheikh - Developer',
                text: 'Check out my personal portfolio profile!',
                url: window.location.href
            };

            if (navigator.share) {
                navigator.share(shareData);
            } else {
                copyLink();
            }
        }

        // Scroll Reveal
        function revealOnScroll() {
            const reveals = document.querySelectorAll('.reveal');
            reveals.forEach(element => {
                const windowHeight = window.innerHeight;
                const elementTop = element.getBoundingClientRect().top;
                const elementVisible = 100;

                if (elementTop < windowHeight - elementVisible) {
                    element.classList.add('visible');
                }
            });
        }

        // Particle Animation
        function createParticles() {
            const container = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 5 + 's';
                particle.style.animation = `particleFloat ${5 + Math.random() * 10}s ease-in-out infinite`;
                container.appendChild(particle);
            }

            // Add particle animation style
            const style = document.createElement('style');
            style.textContent = `
                @keyframes particleFloat {
                    0%, 100% { 
                        opacity: 0;
                        transform: translateY(0) scale(0);
                    }
                    10% { 
                        opacity: 0.6;
                        transform: translateY(-20px) scale(1);
                    }
                    90% { 
                        opacity: 0.3;
                        transform: translateY(-80px) scale(0.5);
                    }
                }
            `;
            document.head.appendChild(style);
        }

        // Mouse Move Effect for Orbs
        function handleMouseMove(e) {
            const orbs = document.querySelectorAll('.orb');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;

            orbs.forEach((orb, index) => {
                const speed = (index + 1) * 10;
                const xOffset = (x - 0.5) * speed;
                const yOffset = (y - 0.5) * speed;
                orb.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
            });
        }

        // Initialize everything
        document.addEventListener('DOMContentLoaded', () => {
            // Start typing animation
            setTimeout(typeText, 1000);

            // Start image slider
            setInterval(nextImage, 4000);

            // Create particles
            createParticles();

            // Scroll reveal
            window.addEventListener('scroll', revealOnScroll);
            revealOnScroll();

            // Mouse move effect
            document.addEventListener('mousemove', handleMouseMove);
        });
    </script>
